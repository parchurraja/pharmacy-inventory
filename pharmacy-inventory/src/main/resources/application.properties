# Server
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration (Loaded from environment variables with fallback)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Initial Credentials (Configurable via Environment Variables)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
app.pharmacist.username=${APP_PHARMACIST_USERNAME:pharmacist}
app.pharmacist.password=${APP_PHARMACIST_PASSWORD:Pharm@123}

# Security Isolation for Demo Accounts
app.seed-demo-users=${APP_SEED_DEMO_USERS:true}
app.allow-default-credentials=${APP_ALLOW_DEFAULT_CREDENTIALS:true}

# App name
spring.application.name=pharmacy-inventory

